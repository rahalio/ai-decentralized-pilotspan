apis:
  identity:
    root: src/identity.yaml
  readiness:
    root: src/readiness.yaml
  pilots:
    root: src/pilots.yaml
  anonymisation-gates:
    root: src/anonymisation-gates.yaml
  custodians:
    root: src/custodians.yaml
  talent-assignments:
    root: src/talent-assignments.yaml
  shadow-ai:
    root: src/shadow-ai.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []

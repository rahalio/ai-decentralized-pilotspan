openapi: 3.1.0
info:
  title: Talent Assignments API
  version: 0.1.0
  description: |
    ATF dream-team slots including one-hour domain specialist commitment (BR-5).
  license:
    name: Proprietary
    url: https://pilotspan.local/license
  x-domain: tal
servers:
  - url: https://api.pilotspan.local
security:
  - apiKey: []
tags:
  - name: TalentAssignments
    description: Dream-team role assignments
paths:
  /v1/talent-assignments:
    get:
      operationId: listTalentAssignments
      tags: [TalentAssignments]
      summary: List talent assignments
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: pilotId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Assignments page
          content:
            application/json:
              schema:
                $ref: ./talent-assignments.schemas.yaml#/components/schemas/TalentAssignmentListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: createTalentAssignment
      tags: [TalentAssignments]
      summary: Create a dream-team assignment
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./talent-assignments.schemas.yaml#/components/schemas/TalentAssignmentCreate
      responses:
        '201':
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: ./talent-assignments.schemas.yaml#/components/schemas/TalentAssignmentResponse
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/talent-assignments/{assignmentId}:
    get:
      operationId: getTalentAssignment
      tags: [TalentAssignments]
      summary: Get a talent assignment
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            $ref: ./talent-assignments.schemas.yaml#/components/schemas/TalentAssignmentId
      responses:
        '200':
          description: Assignment
          content:
            application/json:
              schema:
                $ref: ./talent-assignments.schemas.yaml#/components/schemas/TalentAssignmentResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
